<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CNGC Vision Day Scanner</title>
</head>

<body>

  <h1>CNGC Vision Day 2026</h1>

  <h2>CHECK-IN</h2>

  <p id="status">CAMERA TEST</p>

  <div id="qr-reader"
     style="
       width:100%;
       max-width:600px;
       margin:auto;
     ">
</div>

  <script src="https://unpkg.com/html5-qrcode"></script>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<script>

const status = document.getElementById("status");

let qrScanner = null;
let qrProcessing = false;

function onScanSuccess(decodedText, decodedResult) {

    if (qrProcessing) return;

    qrProcessing = true;

    console.log("QR CODE DETECTED:", decodedText);

    status.innerHTML =
        "CHECKING: " + decodedText;


    // ==========================================
    // GOOGLE APPS SCRIPT API
    // ==========================================

    const scriptUrl =
        "https://script.google.com/macros/s/AKfycbxmydgn03NnglkCd7rDT6jpsiSeodtA0GLKownRZ_lxZV81cp15Ng3qx72oh_WTrtaSGg/exec";


    const apiUrl =
        scriptUrl +
        "?api=checkin" +
        "&code=" + encodeURIComponent(decodedText);


    console.log("API URL:", apiUrl);


    // ==========================================
    // JSONP CALLBACK
    // ==========================================

    const callbackName =
        "checkInCallback_" + Date.now();


    window[callbackName] = function(result) {

        console.log("CHECK-IN RESULT:", result);


        if (result.success) {

            status.innerHTML =
                "✅ CHECK-IN SUCCESSFUL" +
                "<br><br>" +
                "<strong>" +
                result.attendee.name +
                "</strong>" +
                "<br>" +
                "Code: " +
                result.attendee.code +
                "<br>" +
                "Payment: " +
                result.attendee.paymentStatus +
                "<br>" +
                "Time: " +
                result.attendee.checkInTime;

        } else {

            status.innerHTML =
                "❌ " + result.message;

            if (result.attendee) {

                status.innerHTML +=
                    "<br><br>" +
                    "<strong>" +
                    result.attendee.name +
                    "</strong>";

            }

        }


        qrProcessing = false;


        // Remove callback
        delete window[callbackName];

    };


    // ==========================================
    // CREATE JSONP SCRIPT
    // ==========================================

    const script =
        document.createElement("script");


    script.src =
        apiUrl +
        "&callback=" +
        callbackName;


    script.onerror = function() {

        console.error(
            "Unable to connect to Apps Script."
        );

        status.innerHTML =
            "❌ CONNECTION ERROR";

        qrProcessing = false;

        delete window[callbackName];

    };


    document.body.appendChild(script);


    // ==========================================
    // STOP CAMERA
    // ==========================================

    qrScanner.stop()
        .then(function() {

            console.log("QR scanner stopped.");

        })
        .catch(function(error) {

            console.log(
                "Scanner stop error:",
                error
            );

        });

}


function onScanFailure(errorMessage) {

    // Ignore normal QR detection failures.
    // The scanner continues searching.

}


function startQRScanner() {

    console.log("Starting QR scanner...");

    // Make sure the library loaded
    if (typeof Html5Qrcode === "undefined") {

        status.innerHTML =
            "QR LIBRARY FAILED TO LOAD";

        console.error("Html5Qrcode is not available.");

        return;
    }


    qrScanner = new Html5Qrcode("qr-reader");


    const config = {

        fps: 10,

        qrbox: {
            width: 250,
            height: 250
        }

    };


    qrScanner.start(

        { facingMode: "environment" },

        config,

        onScanSuccess,

        onScanFailure

    )
    .then(function() {

        console.log("QR CAMERA STARTED");

        status.innerHTML =
            "READY — SCAN QR CODE";

    })
    .catch(function(error) {

        console.error(
            "FULL QR CAMERA ERROR:",
            error
        );

        status.innerHTML =
            "CAMERA ERROR: " + error;

    });

}


window.addEventListener("load", function() {

    startQRScanner();

});

</script>

</body>
</html>
