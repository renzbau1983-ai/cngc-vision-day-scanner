<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CNGC Vision Day Scanner</title>
</head>

<body>

  <h1>CNGC Vision Day 2026</h1>

  <h2>CHECK-IN</h2>

  <p id="status">CAMERA TEST</p>

  <div id="qr-reader"
     style="
       width:100%;
       max-width:600px;
       margin:auto;
     ">
</div>

  <script src="https://unpkg.com/html5-qrcode"></script>

<script>

const status = document.getElementById("status");

let qrScanner = null;
let qrProcessing = false;

function onScanSuccess(decodedText) {

  // Prevent multiple scans of the same QR
  if (qrProcessing) return;

  qrProcessing = true;

  console.log("QR CODE:", decodedText);

  status.innerHTML =
    "QR DETECTED: " + decodedText;

  // Stop scanning temporarily
  if (qrScanner) {

    qrScanner.stop()
      .then(function() {

        console.log("QR scanner stopped");

      })
      .catch(function(error) {

        console.log("Scanner stop error:", error);

      });

  }

}

function onScanFailure(error) {

  // Normal scanning failures are ignored.
  // The scanner keeps looking for a QR code.

}

function startQRScanner() {

  qrScanner = new Html5Qrcode("qr-reader");

  qrScanner.start(
    {
      facingMode: "environment"
    },
    {
      fps: 10,

      qrbox: {
        width: 250,
        height: 250
      }
    },

    onScanSuccess,

    onScanFailure

  ).then(function() {

    status.innerHTML = "READY — SCAN QR CODE";

  }).catch(function(error) {

    console.error("QR CAMERA ERROR:", error);

    status.innerHTML =
      "CAMERA ERROR: " + error;

  });

}

startQRScanner();

</script>

</body>
</html>
